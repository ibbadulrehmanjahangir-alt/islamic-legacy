<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Islamic Legacy — Seller Dashboard</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f7f6;color:#233c35}
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:#0d3027;color:white;padding:25px 15px}
.logo{font-family:Georgia,serif;font-size:23px;text-align:center;margin-bottom:30px}
.nav button{width:100%;padding:14px;margin:4px 0;border:0;border-radius:10px;background:transparent;color:white;text-align:left;cursor:pointer;font-size:15px}
.nav button:hover,.nav button.active{background:#174f40}
.main{flex:1;padding:30px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.top h1{color:#174f40}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.box{background:white;border-radius:16px;padding:25px;box-shadow:0 8px 25px #0000000d}
.box h3{margin-bottom:10px;color:#174f40}
.number{font-size:30px;font-weight:bold}
.page{display:none}
.page.active{display:block}
.big-btn{background:#174f40;color:white;border:0;padding:15px 22px;border-radius:10px;cursor:pointer;margin-top:20px}
input,textarea,select{width:100%;padding:13px;margin:7px 0 15px;border:1px solid #ddd;border-radius:9px}
label{font-weight:bold}
.save{background:#174f40;color:white;border:0;padding:14px 25px;border-radius:10px;cursor:pointer}
.product{background:white;padding:18px;border-radius:14px;margin-top:15px}
@media(max-width:750px){
.sidebar{width:190px}
.grid{grid-template-columns:1fr}
.main{padding:18px}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="logo">Islamic Legacy</div>

<div class="nav">

<button onclick="showPage('dashboard')">🏠 Dashboard</button>
<button onclick="showPage('products')">🛍️ Products</button>
<button onclick="showPage('add')">➕ Add Product</button>
<button onclick="showPage('orders')">📦 Orders</button>
<button onclick="showPage('vouchers')">🎟️ Vouchers</button>
<button onclick="showPage('banners')">🖼️ Banners</button>
<button onclick="showPage('contact')">📞 Contact</button>
<button onclick="showPage('settings')">⚙️ Settings</button>

</div>
</aside>


<main class="main">

<!-- DASHBOARD -->

<section id="dashboard" class="page active">

<div class="top">
<h1>Dashboard</h1>
</div>

<div class="grid">

<div class="box">
<h3>Products</h3>
<div class="number">0</div>
</div>

<div class="box">
<h3>Orders</h3>
<div class="number">0</div>
</div>

<div class="box">
<h3>Sales</h3>
<div class="number">Rs. 0</div>
</div>

</div>

</section>


<!-- PRODUCTS -->

<section id="products" class="page">

<h1>Products</h1>

<div class="box" style="margin-top:20px">

<p>No products added yet.</p>

<button class="big-btn" onclick="showPage('add')">
➕ Add Product
</button>

</div>

</section>


<!-- ADD PRODUCT -->

<section id="add" class="page">

<h1>Add Product</h1>

<div class="box" style="margin-top:20px">

<label>Product Name</label>
<input id="productName" placeholder="Hajj Banner">

<label>Price</label>
<input id="productPrice" type="number" placeholder="599">

<label>Image URL</label>
<input id="productImage" placeholder="Image URL">

<label>Video URL</label>
<input id="productVideo" placeholder="Video URL">

<label>Description</label>
<textarea id="productDescription" placeholder="Product description"></textarea>

<button class="save" onclick="saveProduct()">
💾 Save Product
</button>

<p id="productStatus"></p>

</div>

</section>


<!-- ORDERS -->

<section id="orders" class="page">

<h1>Orders</h1>

<div class="box" style="margin-top:20px">
<p>No orders yet.</p>
</div>

</section>


<!-- VOUCHERS -->

<section id="vouchers" class="page">

<h1>Vouchers</h1>

<div class="box" style="margin-top:20px">

<label>Voucher Code</label>
<input placeholder="ISLAMIC10">

<label>Discount %</label>
<input type="number" placeholder="10">

<button class="save">
💾 Save Voucher
</button>

</div>

</section>


<!-- BANNERS -->

<section id="banners" class="page">

<h1>Banners / Slider</h1>

<div class="box" style="margin-top:20px">

<label>Banner Image URL</label>
<input placeholder="Banner image URL">

<label>Banner Heading</label>
<input placeholder="Beautiful Islamic Collection">

<button class="save">
💾 Save Banner
</button>

</div>

</section>


<!-- CONTACT -->

<section id="contact" class="page">

<h1>Contact Us</h1>

<div class="box" style="margin-top:20px">

<label>Contact Number</label>

<input id="contactNumber" value="03030403968">

<button class="save">
💾 Save Contact
</button>

</div>

</section>


<!-- SETTINGS -->

<section id="settings" class="page">

<h1>Settings</h1>

<div class="box" style="margin-top:20px">

<label>Store Name</label>

<input value="Islamic Legacy">

<label>Currency</label>

<select>
<option>PKR (Rs.)</option>
</select>

<button class="save">
💾 Save Settings
</button>

</div>

</section>


</main>

</div>


<script>

function showPage(page){

document.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document.getElementById(page)
.classList.add("active");

}


function saveProduct(){

document.getElementById("productStatus").textContent =
"✅ Product saved. Sync connection will be added next.";

}

</script>

</body>
</html>
